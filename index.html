function tickHabit(id, x, y) {
  const h = S.habits.find(h => h.id === id); if (!h) return;
  const k = TODAY(), was = isDone(h, k);
  if (was) { h.log[k] = 0; Sound.tick(); toast('Reset for today'); }
  else {
    h.log[k] = cnt(h, k) + 1;
    buzz(14);
    if (isDone(h, k)) {
      ripple(x, y); confetti(x, y); Sound.chime();
      toast(CHEERS[Math.floor(Math.random() * CHEERS.length)]);
      if (allDoneToday()) setTimeout(() => {
        toast(`Every habit done today, ${NAME}! The kitty is napping happily 😻`, 3200);
        Sound.purr();
      }, 1400);
    } else { Sound.pop(); ripple(x, y); }
  }
  save(); render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  const x = e.clientX || innerWidth / 2, y = e.clientY || innerHeight / 2;
  if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;

  switch (a) {
    case 'go': TAB = t.dataset.tab; setTab(TAB); break;
    case 'tick': e.stopPropagation(); tickHabit(id, x, y); break;
    case 'habit': habitDetail(S.habits.find(h => h.id === id)); break;
    case 'newhabit': habitEditor(null); break;
    case 'edithabit': habitEditor(S.habits.find(h => h.id === id)); break;
    case 'savehabit': {
      const n = $('#hName').value.trim();
      if (!n) { toast('Give it a name first 💭'); $('#hName').focus(); return; }
      draft.name = n; draft.unit = $('#hUnit').value.trim();
      const i = S.habits.findIndex(h => h.id === draft.id);
      if (i > -1) S.habits[i] = Object.assign(S.habits[i], draft);
      else { S.habits.push(draft); confetti(x, y); Sound.chime(); }
      save(); closeSheet(); render(); toast('Saved 💗'); break;
    }
    case 'delhabit':
      if (confirm('Delete this habit and its history?')) {
        S.habits = S.habits.filter(h => h.id !== id); save(); closeSheet(); render(); toast('Deleted');
      } break;
    case 'archive': {
      const h = S.habits.find(h => h.id === id); h.archived = !h.archived;
      save(); closeSheet(); render(); toast(h.archived ? 'Archived 📥' : 'Restored ↩︎'); break;
    }
    case 'inc': case 'dec': {
      const h = S.habits.find(h => h.id === id), k = TODAY();
      h.log[k] = Math.max(0, cnt(h, k) + (a === 'inc' ? 1 : -1));
      if (a === 'inc' && isDone(h, k)) { confetti(x, y); Sound.chime(); } else Sound.pop();
      save(); habitDetail(h); render(); break;
    }

    case 'recipe': recipeSheet(); Sound.pop(); break;
    case 'hair': {
      S.hairNudge = (S.hairNudge || 0) + 1;          // shuffle to the next idea
      save(); rToday(); Sound.pop(); confetti(x, y, ['💇‍♀️', '✨', '🎀']);
      const h = daily(HAIRSTYLES, 7 + S.hairNudge);
      toast(`${h.e} <b>${esc(h.n)}</b>`, 2600); break;
    }
    case 'weather': {
      const c = wxCache();
      if (c) { toast('Refreshing the forecast… 🌤️'); loadWeather(c.lat, c.lon); }
      else askWeather();
      break;
    }

    case 'pet': e.stopPropagation(); playWith(id, x, y); break;
    case 'feed': {
      e.stopPropagation();
      const p = petById(id), s = petState(id);
      if (s.fed === TODAY()) { toast(`${p.name} is full already 🍽️`); Sound.tick(); return; }
      s.fed = TODAY(); s.aff = Math.min(100, petAff(id) + 14); s.last = TODAY();
      Sound.critter(p.voice); Sound.chime();
      confetti(x, y, [p.treat, '💗', '✨']); buzz(20);
      toast(`${p.name} loved the ${p.treat} — thank you, ${NAME}!`);
      save(); rPets(); break;
    }
    case 'petall': {
      PETS.forEach((p, i) => setTimeout(() => {
        const s = petState(p.id);
        s.aff = Math.min(100, petAff(p.id) + 4); s.last = TODAY();
        Sound.critter(p.voice);
        const el = $('#pet-' + p.id);
        if (el) { el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce'); }
        if (i === PETS.length - 1) { save(); rPets(); toast(`Everyone says hi back, ${NAME} 🐾💗`, 2800); }
      }, i * 260));
      confetti(x, y, ['🐾', '💗', '✨', '🐱', '🐰']);
      break;
    }

    case 'bug': {
      const b = BUGS.find(b => b.id === id); if (!b) return;
      const el = t;
      Sound.critter(b.s); buzz(8);
      el.classList.add('away');
      confetti(x, y, ['✨', '💗']);
      toast(CRITTER_LINES[Math.floor(Math.random() * CRITTER_LINES.length)]);
      BUGS = BUGS.filter(v => v.id !== b.id);
      setTimeout(() => el.remove(), 900);
      setTimeout(() => {                                    // a new visitor wanders in
        if (TAB !== 'garden') return;
        const c = CRITTERS[Math.floor(Math.random() * CRITTERS.length)], ground = c.s === 'crawl';
        BUGS.push({ id: uid(), e: c.e, n: c.n, s: c.s, x: 8 + Math.random() * 72,
          y: ground ? 58 + Math.random() * 10 : 10 + Math.random() * 42,
          path: ground ? 'crawl' : 'flit' + (1 + Math.floor(Math.random() * 3)),
          dur: (ground ? 16 : 7) + Math.random() * 8, delay: 0, scale: .82 + Math.random() * .5 });
        const layer = $('#bugLayer'); if (layer) layer.innerHTML = bugsHTML();
      }, 4200 + Math.random() * 5000);
      break;
    }
    case 'fill': e.stopPropagation(); fillCan(); break;

    case 'seeds': seedSheet(); break;
    case 'plant': {
      const ty = plantById(t.dataset.type);
      const p = { id: uid(), type: ty.id, name: ty.name, planted: TODAY(), water: [TODAY()], love: 0 };
      S.garden.pots.push(p); S.garden.active = p.id;
      const first = !S.garden.seenFirst; S.garden.seenFirst = true;
      save(); closeSheet(); TAB = 'garden'; setTab('garden');
      confetti(innerWidth / 2, innerHeight / 2, ['🌱', '✨', '💚', '🌿']); Sound.chime();
      toast(first ? PLANT_FIRST_MSG : `${ty.emoji} planted! Water me every day 💧`, 3600);
      break;
    }
    case 'water': case 'water-quick': {
      const p = id ? S.garden.pots.find(p => p.id === id) : activePot();
      if (!p) return;
      if (a === 'water-quick') { waterPot(p, x, y); TAB = 'garden'; setTab('garden'); }
      else waterPot(p, x, y);
      break;
    }
    case 'switch': S.garden.active = id; save(); rGarden(); break;
    case 'harvest': {
      const p = S.garden.pots.find(p => p.id === id); if (!p) return;
      const ty = plantById(p.type);
      S.garden.harvested[ty.id] = (S.garden.harvested[ty.id] || 0) + 1;
      S.garden.pots = S.garden.pots.filter(x => x.id !== p.id);
      S.garden.active = S.garden.pots[0] ? S.garden.pots[0].id : null;
      save(); rGarden();
      confetti(innerWidth / 2, innerHeight / 2.4, [ty.emoji, '🎉', '✨', '💗']);
      Sound.chime(); Sound.meow(.4);
      toast(`You grew a ${ty.name}, ${NAME}! ${ty.emoji} It's on your shelf now.`, 3600);
      break;
    }

    case 'newgoal': goalEditor(null); break;
    case 'editgoal': goalEditor(S.goals.find(g => g.id === id)); break;
    case 'savegoal': {
      const ti = $('#gTitle').value.trim();
      if (!ti) { toast('Name your goal first 💭'); $('#gTitle').focus(); return; }
      draft.title = ti;
      draft.target = Math.max(1, +$('#gTarget').value || 1);
      draft.unit = $('#gUnit').value.trim();
      draft.due = $('#gDue').value || '';
      const old = draft.steps || [];
      draft.steps = $$('.gstep').map((inp, i) => ({ t: inp.value.trim(), done: old[i] ? old[i].done : false }))
        .filter(s => s.t);
      const i = S.goals.findIndex(g => g.id === draft.id);
      if (i > -1) S.goals[i] = Object.assign(S.goals[i], draft);
      else { S.goals.push(draft); confetti(x, y); Sound.chime(); }
      save(); closeSheet(); render(); toast('Saved 💜'); break;
    }
    case 'delgoal':
      if (confirm('Delete this goal?')) { S.goals = S.goals.filter(g => g.id !== id); save(); closeSheet(); render(); }
      break;
    case 'ginc': case 'gdec': {
      const g = S.goals.find(g => g.id === id);
      g.cur = Math.max(0, g.cur + (a === 'ginc' ? 1 : -1));
      const justDone = !g.done && g.cur >= g.target;
      if (justDone) {
        g.done = true; confetti(x, y, ['🎉', '🏆', '✨', '💜', '🌟']); Sound.chime();
        toast(`Goal complete, ${NAME}! ${g.icon} Look at what you did 🎉`, 3400);
      } else if (g.done && g.cur < g.target) { g.done = false; Sound.pop(); }
      else Sound.pop();
      save(); rGoals(); break;
    }
    case 'step': {
      const g = S.goals.find(g => g.id === id), s = g.steps[+t.dataset.i];
      s.done = !s.done; Sound.tick(); buzz();
      if (s.done) confetti(x, y, ['✨', '💜']);
      save(); rGoals(); break;
    }

    case 'newnote': noteEditor(null); break;
    case 'note': noteEditor(S.notes.find(n => n.id === id)); break;
    case 'savenote': {
      draft.title = $('#nTitle').value.trim();
      draft.body = $('#nBody').value;
      if (!draft.title && !draft.body.trim()) { toast('Write something first 💭'); return; }
      draft.up = Date.now();
      const i = S.notes.findIndex(n => n.id === draft.id);
      if (i > -1) S.notes[i] = Object.assign(S.notes[i], draft); else S.notes.unshift(draft);
      save(); closeSheet(); render(); Sound.pop(); toast('Note saved 💌'); break;
    }
    case 'delnote':
      if (confirm('Delete this note?')) { S.notes = S.notes.filter(n => n.id !== id); save(); closeSheet(); render(); }
      break;

    case 'bubu': {
      S.bubuIdx = (S.bubuIdx + 1) % BUBU_LINES.length; save(); rToday();
      const card = $('.bubu-card');
      if (card) { card.classList.add('wiggle'); setTimeout(() => card.classList.remove('wiggle'), 750); }
      Sound.pop(); confetti(x, y, ['💗', '🧸', '✨']); break;
    }
    case 'settings': settingsSheet(); break;
    case 'tsound': S.settings.sound = !S.settings.sound; Sound.on = S.settings.sound;
      t.classList.toggle('on', S.settings.sound); if (S.settings.sound) Sound.meow(); save(); break;
    case 'ttheme': S.settings.theme = theme() === 'twilight' ? 'blossom' : 'twilight';
      t.classList.toggle('on', S.settings.theme === 'twilight'); applyTheme(); save(); Sound.tick(); break;
    case 'meow': Sound.meow(); confetti(x, y, ['🐱', '🐾', '💗']);
      toast(CAT_LINES[Math.floor(Math.random() * CAT_LINES.length)]); break;
    case 'petcat': {
      Sound.meow(); buzz(20);
      t.classList.add('hop'); setTimeout(() => t.classList.remove('hop'), 850);
      confetti(x, y, ['🐾', '💗', '✨', '🐱']);
      toast(CAT_LINES[Math.floor(Math.random() * CAT_LINES.length)]);
      if (allDoneToday()) setTimeout(() => Sound.purr(), 700);
      break;
    }
    case 'export': exportData(); break;
    case 'import': importData(); break;
    case 'reset':
      if (confirm('This erases every habit, goal, note and plant. Are you sure?')) {
        localStorage.removeItem(KEY); S = DEFAULTS(); save(); applyTheme(); closeSheet(); render();
        toast('Fresh start 🌸');
      } break;
    case 'close': closeSheet(); break;
  }
});

/* FAB per tab */
$('#fab').addEventListener('click', e => {
  Sound.pop();
  ({ habits: () => habitEditor(null), goals: () => goalEditor(null),
     notes: () => noteEditor(null), garden: () => seedSheet(),
     pets: () => rPets(), today: () => habitEditor(null) })[TAB]();
});

/* tabs */
function setTab(name) {
  TAB = name;
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  Sound.tick(); buzz(8);
  if (name === 'garden') { spawnBugs(3 + Math.floor(Math.random() * 3)); startBugs(); }
  render();
  $('main').scrollTop = 0;
}
$$('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#scrim').addEventListener('click', closeSheet);
let rzT;
addEventListener('resize', () => {
  movePill();
  clearTimeout(rzT); rzT = setTimeout(render, 220);   // re-fit charts on rotate / split view
});

/* ---------- theme + icon ---------- */
const sysDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
const theme = () => S.settings.theme || (sysDark() ? 'twilight' : 'blossom');
function applyTheme() {
  document.documentElement.dataset.theme = theme();
  $('#themeColor').content = theme() === 'twilight' ? '#1B0F26' : '#FFE1F0';
}
try {
  matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change', () => { if (!S.settings.theme) applyTheme(); });
} catch (e) { }
function makeAppIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 180, 180);
    gr.addColorStop(0, '#FF7DB8'); gr.addColorStop(.55, '#C77DFF'); gr.addColorStop(1, '#9B7DFF');
    g.fillStyle = gr; g.fillRect(0, 0, 180, 180);
    const px = 9, ox = 18, oy = 18;
    CAT_MAP.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '.') return;
      g.fillStyle = PX_PALETTE[ch] || '#fff';
      g.fillRect(ox + x * px, oy + y * px, px, px);
    }));
    $('#appIcon').href = c.toDataURL('image/png');
  } catch (e) { }
}

/* ---------- boot ---------- */
function boot() {
  load();
  Sound.on = S.settings.sound;
  applyTheme();
  const last = S.lastDay;
  if (last !== TODAY()) { S.visits = (S.visits || 0) + 1; S.lastDay = TODAY(); S.bubuIdx = (S.bubuIdx || 0) + 1; }
  save();
  makeAppIcon();
  $('#splashCat').innerHTML = catSVG();
  render();
  setTimeout(movePill, 60);
}
boot();

/* splash → first tap unlocks audio (iOS requires a gesture) */
function enter() {
  Sound.boot(); Sound.meow();
  setTimeout(() => Sound.purr(), 620);
  const sp = $('#splash');
  sp.classList.add('out');
  setTimeout(() => sp.remove(), 800);
  setTimeout(() => {
    const t = todayHabits().length;
    toast(t ? `${GREETINGS[new Date().getHours() < 12 ? 'morning' : 'evening'][0]} 💗` : `Welcome, ${NAME} 💗`, 2600);
  }, 900);
  document.removeEventListener('pointerdown', enter);
}
document.addEventListener('pointerdown', enter, { once: true });

/* keep the day fresh if the app stays open past midnight */
let lastSeenDay = TODAY();
setInterval(() => { if (TODAY() !== lastSeenDay) { lastSeenDay = TODAY(); render(); } }, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && TODAY() !== lastSeenDay) { lastSeenDay = TODAY(); render(); }
});

</script>
</body>
